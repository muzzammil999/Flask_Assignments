{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username <input name="username" required minlength="3" maxlength="30" autocomplete="username"></label>
  <label>Password <input type="password" name="password" required minlength="8" autocomplete="{% if action == 'register' %}new-password{% else %}current-password{% endif %}"></label>
  <button>{{ title }}</button>
</form>
<p>{% if action == 'login' %}<a href="{{ url_for('register') }}">Need an account?</a>
   {% else %}<a href="{{ url_for('login') }}">Already registered?</a>{% endif %}</p>
{% endblock %}
