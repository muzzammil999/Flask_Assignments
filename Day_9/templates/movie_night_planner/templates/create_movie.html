{% extends 'base.html' %}
{% block title %}Create Movie{% endblock %}
{% block content %}
<h1>Create a movie plan</h1>
{# enctype="multipart/form-data" is required for file (poster) upload. #}
<form method="post" action="{{ url_for('create_movie') }}" enctype="multipart/form-data" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Movie name
    <input name="movie_name" value="{{ form.get('movie_name', '') }}" autofocus>
  </label>
  <label>Genre
    <select name="genre">
      <option value="">Choose a genre</option>
      {% for g in genres %}
        <option value="{{ g }}" {% if form.get('genre') == g %}selected{% endif %}>{{ g }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="row">
    <label>Length (minutes)
      <input name="length" inputmode="numeric" value="{{ form.get('length', '') }}" placeholder="e.g. 120">
    </label>
    <label>Certification
      <select name="certification">
        <option value="">Choose one</option>
        {% for c in certifications %}
          <option value="{{ c }}" {% if form.get('certification') == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>Poster (optional)
    <input type="file" name="poster" accept=".png,.jpg,.jpeg,.webp">
    <small>PNG, JPG, JPEG or WEBP.</small>
  </label>

  <button type="submit">Create movie</button>
  <a href="{{ url_for('home') }}">Cancel</a>
</form>
{% endblock %}
