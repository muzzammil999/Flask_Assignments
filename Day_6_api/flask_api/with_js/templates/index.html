<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Shelf · Flask API + JS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static',filename='style.css') }}"
      rel="stylesheet"
    />
    <script src="{{ url_for('static',filename='app.js') }}" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Book Shelf · Flask API + JS</a>
      </div>
    </nav>
    <main class="container py-4">
      <h1>My books</h1>
      <p>JavaScript requests JSON from the Flask API and updates this page.</p>
      <div id="message" role="status" aria-live="polite"></div>
      <div class="row g-4">
        <section class="col-md-5">
          <h2 class="h5" id="form-heading">Add a book</h2>
          <form id="book-form">
            <input type="hidden" id="book-id" />
            <div class="mb-3">
              <label class="form-label" for="title">Title</label
              ><input
                class="form-control"
                id="title"
                required
                minlength="2"
                maxlength="100"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="author">Author</label
              ><input
                class="form-control"
                id="author"
                required
                minlength="2"
                maxlength="80"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="status">Status</label
              ><select class="form-select" id="status">
                <option>To read</option>
                <option>Reading</option>
                <option>Finished</option>
              </select>
            </div>
            <button class="btn btn-success">Save book</button>
            <button
              class="btn btn-outline-secondary"
              id="cancel"
              type="button"
              hidden
            >
              Cancel edit
            </button>
          </form>
        </section>
        <section class="col-md-7">
          <h2 class="h5">Saved books</h2>
          <div id="books" class="row g-3"></div>
        </section>
      </div>
    </main>
  </body>
</html>
