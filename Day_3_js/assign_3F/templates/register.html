{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="card">
  <h2>Student registration</h2>
  <p class="subtitle">Fields marked <span class="required">*</span> are required.</p>
  <p class="error" id="form-error" hidden role="alert"></p>

  <form id="registration-form" action="{{ url_for('register') }}" enctype="multipart/form-data">
    
    <div class="form-group">
      <label for="full_name">Full name <span class="required">*</span></label>
      <input type="text" id="full_name" name="full_name" required>
    </div>

    <div class="form-group">
      <label for="email">Email <span class="required">*</span></label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="mobile">Mobile number <span class="required">*</span></label>
      <input type="tel" id="mobile" name="mobile" required>
    </div>

    <div class="form-group">
      <label for="dob">Date of birth <span class="required">*</span></label>
      <input type="date" id="dob" name="dob" required>
    </div>

    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Male"> Male</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
        <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
      </div>
    </div>

    <div class="form-group">
      <label for="course">Course</label>
      <select id="course" name="course">
        <option value="">Choose</option>
        <option value="Full Stack Development">Full Stack Development</option>
        <option value="Data Science">Data Science</option>
        <option value="Cloud Computing">Cloud Computing</option>
      </select>
    </div>

    <div class="form-group">
      <label for="qualification">Qualification <span class="required">*</span></label>
      <select id="qualification" name="qualification" required>
        <option value="">Choose</option>
        <option value="High School">High School</option>
        <option value="Bachelor's">Bachelor's</option>
        <option value="Master's">Master's</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Training mode</label>
      <div class="radio-group">
        <label><input type="radio" name="training_mode" value="Online"> Online</label>
        <label><input type="radio" name="training_mode" value="Offline"> Offline</label>
      </div>
    </div>

    <div class="form-group">
      <label>Skills (choose at least one) <span class="required">*</span></label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
        <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
        <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
        <label><input type="checkbox" name="skills" value="Python"> Python</label>
        <label><input type="checkbox" name="skills" value="SQL"> SQL</label>
      </div>
    </div>

    <div class="form-group">
      <label for="experience">Years of experience</label>
      <input type="number" id="experience" name="experience" min="0" value="0">
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3"></textarea>
    </div>

    <div class="form-group">
      <label for="website">Website (optional)</label>
      <input type="url" id="website" name="website" placeholder="https://example.com">
    </div>

    <div class="form-group">
      <label for="photo">Photo (optional, JPEG or PNG, under 2 MB)</label>
      <input type="file" id="photo" name="photo" accept=".jpg, .jpeg, .png">
    </div>

    <div class="form-group">
      <label for="password">Password <span class="required">*</span></label>
      <input type="password" id="password" name="password" required>
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm password <span class="required">*</span></label>
      <input type="password" id="confirm_password" name="confirm_password" required>
    </div>

    <div class="form-group checkbox-single">
      <label>
        <input type="checkbox" id="agree" name="agree" required>
        I agree to register <span class="required">*</span>
      </label>
    </div>

    <button type="submit" id="submit-btn">Create registration</button>
  </form>
</div>

<script>
  const form = document.getElementById("registration-form");
  const formError = document.getElementById("form-error");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    formError.hidden = true;

    // Check that at least one skill checkbox is checked
    const selectedSkills = form.querySelectorAll('input[name="skills"]:checked');
    if (selectedSkills.length === 0) {
      formError.textContent = "Please select at least one skill.";
      formError.hidden = false;
      return;
    }

    // Password validation
    const pwd = form.querySelector("#password").value;
    const confirmPwd = form.querySelector("#confirm_password").value;
    if (pwd !== confirmPwd) {
      formError.textContent = "Passwords do not match.";
      formError.hidden = false;
      return;
    }

    // File size check (< 2 MB)
    const photoInput = form.querySelector("#photo");
    if (photoInput.files.length > 0) {
      const fileSize = photoInput.files[0].size / 1024 / 1024;
      if (fileSize > 2) {
        formError.textContent = "Photo size must be under 2 MB.";
        formError.hidden = false;
        return;
      }
    }

    // Construct FormData and post to Flask endpoint
    const formData = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: formData
      });

      const result = await response.json();

      if (!response.ok) {
        formError.textContent = result.error || "An error occurred during submission.";
        formError.hidden = false;
        return;
      }

      // Redirect to the student list page on success
      window.location.href = result.redirect_url;
    } catch (err) {
      formError.textContent = "Failed to connect to the server.";
      formError.hidden = false;
    }
  });
</script>
{% endblock %}
