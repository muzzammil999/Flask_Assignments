{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block content %}
<div class="login-wrap"><div class="card login-card">
  <div class="logo"><i class="bi bi-heart-pulse-fill"></i></div>
  <h1 class="h4 text-center fw-bold mb-1">Claims Simulator</h1>
  <p class="text-center text-muted mb-4">Sign in to continue</p>
  <form method="post">{{ csrf() }}
    <div class="mb-3"><label class="form-label" for="username"><i class="bi bi-person"></i> Username</label><input class="form-control" id="username" name="username" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="password"><i class="bi bi-lock"></i> Password</label><input class="form-control" id="password" name="password" type="password" required></div>
    <button class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
  </form>
  <p class="small text-muted text-center mt-3 mb-0">Demo users: aasha, city_hospital, officer_meera, admin_demo</p>
</div></div>
{% endblock %}
