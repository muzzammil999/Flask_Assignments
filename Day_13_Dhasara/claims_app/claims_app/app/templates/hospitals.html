{% extends "base.html" %}
{% block content %}
<h1 class="h4">Hospital directory</h1>
<table class="table table-sm"><tr><th>ID</th><th>Name</th><th>City</th><th>Cashless network</th></tr>
{% for h in hospitals %}<tr><td>{{ h.id }}</td><td>{{ h.name }}</td><td>{{ h.city }}</td><td>{{ 'Yes' if h.network_status else 'No' }}</td></tr>{% endfor %}</table>
{% endblock %}
