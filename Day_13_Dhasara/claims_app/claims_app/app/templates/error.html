{% extends "base.html" %}
{% block content %}
<h1 class="h4">{{ e.code }} - {{ 'Access denied' if e.code == 403 else 'Not found' }}</h1>
<p>{{ 'You are not allowed to view or change this item.' if e.code == 403 else 'This page or record does not exist.' }}</p>
<a href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
{% endblock %}
