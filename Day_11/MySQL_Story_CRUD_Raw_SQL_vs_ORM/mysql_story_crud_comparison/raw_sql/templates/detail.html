{% extends 'base.html' %}{% block title %}{{ story.title }}{% endblock %}{% block content %}<article><h1>{{ story.title }}</h1><p class="muted">By {{ story.author }}</p><p class="story-body">{{ story.body }}</p><div class="actions"><a class="button" href="{{ url_for('edit_story', story_id=story.id) }}">Edit</a><form method="post" action="{{ url_for('delete_story', story_id=story.id) }}" onsubmit="return confirm('Delete this story?')"><button class="danger" type="submit">Delete</button></form><a href="{{ url_for('home') }}">Back</a></div></article>{% endblock %}
