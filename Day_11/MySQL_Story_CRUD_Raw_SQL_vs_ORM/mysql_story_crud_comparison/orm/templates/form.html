{% extends 'base.html' %}{% block title %}{{ heading }}{% endblock %}{% block content %}<h1>{{ heading }}</h1><div class="panel">{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><label for="title">Title</label><input id="title" name="title" maxlength="120" required value="{{ story.title|default('', true) }}"><label for="author">Author</label><input id="author" name="author" maxlength="80" required value="{{ story.author|default('', true) }}"><label for="body">Story</label><textarea id="body" name="body" required>{{ story.body|default('', true) }}</textarea><div class="actions"><button type="submit">Save story</button><a href="{{ url_for('home') }}">Cancel</a></div></form></div>{% endblock %}
