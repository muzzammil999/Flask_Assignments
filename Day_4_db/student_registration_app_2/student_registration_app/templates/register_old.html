{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}

{% block content %}

<div class="registration-page">

  <div class="registration-card">

    <div class="form-header">
      <h2>Student registration</h2>
      <div class="header-line"></div>
    </div>

    <p class="subtitle">
      Fields marked <span class="required">*</span> are required.
    </p>

    <p class="error" id="form-error" hidden role="alert"></p>

    <form
      id="registration-form"
      action="{{ url_for('register') }}"
      enctype="multipart/form-data"
    >

      <!-- ROW 1 -->
      <div class="form-grid grid-3">

        <div class="form-group">
          <label for="full_name">
            Full name <span class="required">*</span>
          </label>
          <input
            type="text"
            id="full_name"
            name="full_name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">
            Email <span class="required">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">
            Mobile number <span class="required">*</span>
          </label>
          <input
            type="tel"
            id="mobile"
            name="mobile"
            required
          >
        </div>

      </div>


      <!-- ROW 2 -->
      <div class="form-grid grid-2">

        <div class="form-group">
          <label for="dob">
            Date of birth <span class="required">*</span>
          </label>

          <input
            type="date"
            id="dob"
            name="dob"
            required
          >
        </div>

        <div class="form-group">
          <label for="course">
            Course <span class="required">*</span>
          </label>

          <select id="course" name="course" required>
            <option value="" selected disabled>Choose</option>
            <option value="Web Development">Web Development</option>
            <option value="Data Science">Data Science</option>
            <option value="Python Programming">Python Programming</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="Cyber Security">Cyber Security</option>
          </select>
        </div>

      </div>


      <!-- DIVIDER -->
      <div class="form-divider"></div>


      <!-- GENDER -->
      <fieldset class="radio-section">

        <legend>
          Gender <span class="required">*</span>
        </legend>

        <div class="radio-options">

          <label class="radio-option">
            <input
              type="radio"
              name="gender"
              value="Female"
              required
            >
            <span class="radio-circle"></span>
            <span>Female</span>
          </label>

          <label class="radio-option">
            <input
              type="radio"
              name="gender"
              value="Male"
            >
            <span class="radio-circle"></span>
            <span>Male</span>
          </label>

          <label class="radio-option">
            <input
              type="radio"
              name="gender"
              value="Other"
            >
            <span class="radio-circle"></span>
            <span>Other</span>
          </label>

          <label class="radio-option">
            <input
              type="radio"
              name="gender"
              value="Prefer not to say"
            >
            <span class="radio-circle"></span>
            <span>Prefer not to say</span>
          </label>

        </div>

      </fieldset>


      <!-- QUALIFICATION -->
      <div class="form-group">
        <label for="qualification">
          Qualification <span class="required">*</span>
        </label>

        <select id="qualification" name="qualification" required>
          <option value="" selected disabled>Choose</option>
          <option value="High School">High School</option>
          <option value="Diploma">Diploma</option>
          <option value="Bachelor's">Bachelor's</option>
          <option value="Master's">Master's</option>
          <option value="PhD">PhD</option>
        </select>
      </div>


      <!-- TRAINING MODE -->
      <fieldset class="radio-section">

        <legend>
          Training mode <span class="required">*</span>
        </legend>

        <div class="radio-options">

          <label class="radio-option">
            <input
              type="radio"
              name="training_mode"
              value="Online"
              required
            >
            <span class="radio-circle"></span>
            <span>Online</span>
          </label>

          <label class="radio-option">
            <input
              type="radio"
              name="training_mode"
              value="Offline"
            >
            <span class="radio-circle"></span>
            <span>Offline</span>
          </label>

        </div>

      </fieldset>


      <!-- SKILLS -->
      <fieldset class="radio-section skills-section">

        <legend>
          Skills <span class="required">*</span>
          <small>(choose at least one)</small>
        </legend>

        <div class="checkbox-options">

          <label>
            <input type="checkbox" name="skills" value="HTML">
            HTML
          </label>

          <label>
            <input type="checkbox" name="skills" value="CSS">
            CSS
          </label>

          <label>
            <input type="checkbox" name="skills" value="JavaScript">
            JavaScript
          </label>

          <label>
            <input type="checkbox" name="skills" value="Python">
            Python
          </label>

          <label>
            <input type="checkbox" name="skills" value="SQL">
            SQL
          </label>

        </div>

      </fieldset>


      <!-- EXPERIENCE -->
      <div class="form-group">
        <label for="experience">
          Years of experience <span class="required">*</span>
        </label>

        <input
          type="number"
          id="experience"
          name="experience"
          min="0"
          value="0"
          required
        >
      </div>


      <!-- ADDRESS -->
      <div class="form-group">
        <label for="address">
          Address <span class="required">*</span>
        </label>

        <textarea
          id="address"
          name="address"
          rows="4"
          required
        ></textarea>
      </div>


      <!-- WEBSITE -->
      <div class="form-group">
        <label for="website">
          Website (optional)
        </label>

        <input
          type="url"
          id="website"
          name="website"
          placeholder="https://example.com"
        >
      </div>


      <!-- PHOTO -->
      <div class="form-group">
        <label for="photo">
          Photo (optional, JPEG or PNG, under 2 MB)
        </label>

        <input
          type="file"
          id="photo"
          name="photo"
          accept=".jpg,.jpeg,.png"
        >
      </div>


      <!-- PASSWORD ROW -->
      <div class="form-grid grid-2">

        <div class="form-group">
          <label for="password">
            Password <span class="required">*</span>
          </label>

          <input
            type="password"
            id="password"
            name="password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirm_password">
            Confirm password <span class="required">*</span>
          </label>

          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
          >
        </div>

      </div>


      <!-- AGREEMENT -->
      <div class="agreement">

        <label>
          <input
            type="checkbox"
            id="agree"
            name="agree"
            required
          >
          I agree to register
          <span class="required">*</span>
        </label>

      </div>


      <button type="submit">
        Create registration
      </button>

    </form>

  </div>

</div>


<script>
const form = document.getElementById("registration-form");
const formError = document.getElementById("form-error");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  formError.hidden = true;

  // Check skills
  const selectedSkills =
    form.querySelectorAll('input[name="skills"]:checked');

  if (selectedSkills.length === 0) {
    formError.textContent =
      "Please select at least one skill.";

    formError.hidden = false;
    return;
  }

  // Password validation
  const pwd =
    form.querySelector("#password").value;

  const confirmPwd =
    form.querySelector("#confirm_password").value;

  if (pwd !== confirmPwd) {
    formError.textContent =
      "Passwords do not match.";

    formError.hidden = false;
    return;
  }

  // File size validation
  const photoInput =
    form.querySelector("#photo");

  if (photoInput.files.length > 0) {

    const fileSize =
      photoInput.files[0].size / 1024 / 1024;

    if (fileSize > 2) {

      formError.textContent =
        "Photo size must be under 2 MB.";

      formError.hidden = false;
      return;
    }
  }

  // FormData
  const formData = new FormData(form);

  try {

    const response = await fetch(form.action, {
      method: "POST",
      body: formData,
    });

    const result = await response.json();

    if (!response.ok) {

      formError.textContent =
        result.error ||
        "An error occurred during submission.";

      formError.hidden = false;
      return;
    }

    window.location.href =
      result.redirect_url;

  } catch (err) {

    formError.textContent =
      "Failed to connect to the server.";

    formError.hidden = false;
  }
});
</script>

{% endblock %}
