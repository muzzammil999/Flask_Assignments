<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Story App</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
	</head>
	<body>
		<main>
			<h1>Story App</h1>
			<p>Write and read stories.</p>
			<h2>Add a story</h2>
			{% if error %}<p class="error">{{ error }}</p>{% endif %}
			<form method="post">
				<p><label>Title <input name="title" required></label></p>
				<p><label>Author <input name="author" required></label></p>
				<p><label>Story <textarea name="story" rows="6" required></textarea></label></p>
				<button type="submit">Add story</button>
			</form>

			<h2>Stories</h2>
			{% if stories %}
			<ul class="story-list">
				{% for story in stories %}
				<li>
					<strong>{{ story['title'] }}</strong> by {{ story['author'] }}
					<a href="{{ url_for('edit_story', story_id=loop.index0) }}">Edit</a>
					
					<form action="{{ url_for('delete_story', story_id=loop.index0) }}" method="post" style="display: inline;">
						<button type="submit" class="btn-delete" onclick="return confirm('Are you sure you want to delete this story?');">Delete</button>
					</form>
					<p class="story-text">{{ story['story'] }}</p>
				</li>
				{% endfor %}
			</ul>
			{% else %}
			<p>No stories yet.</p>
			{% endif %}

		</main>
	</body>
</html>
